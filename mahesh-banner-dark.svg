<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <text x="600" y="140" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="54" font-weight="700" fill="#f0f6fc">
    Hi, I'm Mahesh Kumar
    <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/>
  </text>
  <text x="600" y="190" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="22" fill="#18ec69">
    Cloud &amp; Data Operations Engineer · Backend Developer · Automation Enthusiast
    <animate attributeName="opacity" values="0;0;1" dur="2s" fill="freeze"/>
  </text>
  <rect x="600" y="212" width="0" height="4" rx="2" fill="#18ec69">
    <animate attributeName="width" values="0;220" dur="1.4s" begin="0.6s" fill="freeze"/>
    <animate attributeName="x" values="600;490" dur="1.4s" begin="0.6s" fill="freeze"/>
  </rect>
</svg>
